# ai-generated: 90% - Copilot generated the burn-alert test series and firing-edge assertions from the declared SLOs
# prometheus/alerts_test.yml - promtool unit tests of alerts.yml (MONITORING-SPEC.md M-20, M-21). Run it from the
# repository root with
#   docker run --rm -v "$PWD/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v3.15.0 test rules alerts_test.yml
#
# The checker runs this file as it is (it must pass, 5.03), and then again against four mutants of alerts.yml for
# every alert slo.md declares, each changing only that one rule. Your tests must FAIL on every mutant (5.04):
#
#   for + 5m          fires 5 minutes later. Killed by an assertion that the alert IS firing at the first
#                     evaluation at which the real rule fires.
#   for - 5m          fires up to 5 minutes earlier (made only when `for` is at least 1m). Killed by an assertion
#                     that the alert is NOT yet firing one evaluation before that.
#   threshold x 1.5   needs a burn 1.5 times higher: it fires later, or never. Killed by the "IS firing at the
#                     first evaluation" assertion.
#   threshold / 1.5   fires at two thirds of the burn, so earlier. Killed by the "NOT yet firing" assertion, or by a
#                     long burn just below the threshold that must never fire.
#
# So every declared alert needs both edges: not yet firing one evaluation before its first firing evaluation, and
# firing at it. Find that evaluation with promtool itself: rate() extrapolates at the edges of its range, and the
# minute you compute by hand can be one off. The checker's own probes (M-19) test the rule, not these tests: they
# pass or fail whatever you write here.
#
# Notation. `values: '0+600x70'` is 71 samples, one per `interval`: 0, 600, 1200, ..., 42000 ('a+bxn' is a, a+b,
# ..., a+n*b); `'0x70'` is 71 zeros; the next token continues at the next sample. Counters only grow: a burn changes
# the slope of the bad requests' counter, never its level.
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x70 42513.6+513.6x55'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x70 86.4+86.4x55'
    alert_rule_test:
      - eval_time: 104m
        alertname: KbSearchErrorsBurnFast
        exp_alerts: []
      - eval_time: 105m
        alertname: KbSearchErrorsBurnFast
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P1
            exp_annotations:
              summary: "Rapidly burning /kb/search availability budget"
              description: "The 5xx ratio is above the 14.4x burn threshold over both 1h and 5m windows."

  - interval: 1m
    input_series:
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="200"}'
        values: '0+600x370 222564+564x195'
      - series: 'http_server_request_duration_seconds_count{job="svcdesk", instance="svcdesk:8080", http_request_method="GET", http_route="/kb/search", http_response_status_code="502"}'
        values: '0x370 36+36x195'
    alert_rule_test:
      - eval_time: 9h14m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts: []
      - eval_time: 9h15m
        alertname: KbSearchErrorsBurnSlow
        exp_alerts:
          - exp_labels:
              service: svcdesk
              slo: availability
              severity: P2
            exp_annotations:
              summary: "Sustained /kb/search availability budget burn"
              description: "The 5xx ratio is above the 6x burn threshold over both 6h and 30m windows."
